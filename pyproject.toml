[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "focuswatch-dataset"
version = "0.1.0"
requires-python = ">=3.11"
# DESIGN §10: code is Apache-2.0 (LICENSE at repo root); the published
# dataset itself is CC BY 4.0, declared separately in the bundle's own
# generated datapackage.json/LICENSE - the two must not be conflated.
license = "Apache-2.0"
dependencies = [
    "pandas>=2.0",
    # Why: the Parquet footer records `created_by: parquet-cpp-arrow <version>`,
    # so byte-level reproducibility of a release holds only within a major version.
    "pyarrow>=24.0,<25.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]
tui = ["textual>=0.56"]

[project.scripts]
fw = "focuswatch_dataset.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/focuswatch_dataset"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
